{{- $src := .Get "src" | default (.Get 0) -}}
{{- $alt := .Get "alt" | default (.Get 1) -}}
{{- $caption := .Get "caption" | default (.Get 2) -}}
{{- $image := partial "resolve-image.html" (dict "page" .Page "src" $src) -}}
<figure><img src="{{ $image.src }}" alt="{{ $alt }}"{{ with $image.width }} width="{{ . }}" height="{{ $image.height }}"{{ end }} loading="lazy" decoding="async">{{ with $caption }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}</figure>

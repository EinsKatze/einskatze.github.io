{{ define "main" }}
<section class="page-heading panel"><div class="panel-kicker">{{ i18n "searchIndex" }} <span>JSON · {{ .Site.Language.Label }}</span></div><h1>{{ .Title }}</h1>{{ with .Description }}<p>{{ . }}</p>{{ end }}</section>
<section class="search-panel panel"><label for="search-input">{{ i18n "searchLabel" }}</label><input id="search-input" type="search" placeholder="{{ .Params.placeholder | default (i18n "searchPlaceholder") }}" autocomplete="off"><p class="search-hint">{{ i18n "searchHint" }}</p><div id="search-results" class="post-list" data-index-url="{{ .Site.Home.RelPermalink }}index.json" data-fuse-options="{{ .Site.Params.fuseOpts | jsonify }}" data-loading-message="{{ i18n "searchLoading" }}" data-empty-message="{{ i18n "searchNoResults" }}" data-error-message="{{ i18n "searchUnavailable" }}" aria-live="polite"></div></section>
{{ end }}
